<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixDrive - Нэвтрэх</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="login-container">
    <div class="login-box">

      <div class="login-logo">
        <span class="logo-icon">🔧</span>
        <h1>FixDrive</h1>
        <p>Car Service Booking Platform</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Нэвтрэх нэр</label>
          <input type="text" id="username" placeholder="Нэвтрэх нэр" required />
        </div>

        <div class="form-group">
          <label for="password">Нууц үг</label>
          <input type="password" id="password" placeholder="Нууц үг" required />
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <button type="submit" class="btn-login">Нэвтрэх</button>
      </form>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
